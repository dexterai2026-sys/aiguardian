<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Guardian</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>
  <body>
    <div id="app">
      <p id="status">Guardian — protection active</p>
      <div id="browser-notice" hidden>
        <p id="browser-notice-text"></p>
        <button id="browser-notice-dismiss" type="button">Got it</button>
      </div>
      <ul id="site-list"></ul>

      <h2>Usage stats</h2>
      <p id="usage-stats-empty" hidden>No findings yet.</p>
      <table id="usage-stats-table" hidden>
        <thead>
          <tr>
            <th>Site</th>
            <th>Category</th>
            <th>Findings</th>
            <th>Masked</th>
          </tr>
        </thead>
        <tbody id="usage-stats-body"></tbody>
      </table>
      <button id="clear-usage-stats" type="button">Clear stats</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
